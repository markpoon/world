services:
  - type: web
    name: world
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: RACK_ENV
        value: development
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: world-db
          property: connectionString
databases:
  - name: world-db
    plan: free
